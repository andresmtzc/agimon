<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Agimon Reports</title>
  <link rel="stylesheet" href="./reports.css?v=20260701-3">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Agimon</p>
        <h1 id="report-title">Reporte</h1>
      </div>
      <div class="meta" id="report-meta"></div>
    </header>

    <section class="summary" id="summary" hidden></section>

    <section class="task-filters" id="task-filters" hidden>
      <div class="task-filter-buttons" role="group" aria-label="Filtrar pendientes por fecha compromiso">
        <button type="button" class="task-filter is-active" data-date-filter="all">Todos</button>
        <button type="button" class="task-filter" data-date-filter="today">Hoy</button>
        <button type="button" class="task-filter" data-date-filter="7">Próx. 7 días</button>
        <button type="button" class="task-filter" data-date-filter="15">Próx. 15 días</button>
        <button type="button" class="task-filter" data-date-filter="30">Próx. 30 días</button>
        <button type="button" class="task-filter" data-date-filter="overdue">Vencidos</button>
        <button type="button" class="task-filter" data-date-filter="no_date">Sin fecha</button>
      </div>
      <span class="task-filter-count" id="task-filter-count"></span>
    </section>

    <section class="task-command-bar" id="task-command-bar" hidden>
      <div>
        <strong id="task-command-count">0 seleccionados</strong>
        <span id="task-command-preview"></span>
      </div>
      <div class="task-command-actions">
        <button type="button" id="task-command-action">Marcar terminados</button>
      </div>
    </section>

    <section class="table-wrap" id="table-wrap" hidden>
      <table id="report-table"></table>
    </section>

    <section class="empty" id="empty-state">
      <h2>Reporte no disponible</h2>
      <p>Abre el enlace completo de Agimon o pide generar un reporte nuevo.</p>
    </section>
  </main>
  <script src="./reports.js?v=20260701-3"></script>
</body>
</html>
